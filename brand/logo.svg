<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradiente base: simula el metal dorado (sombra → brillo → sombra) -->
    <linearGradient id="goldBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6b4c0c" />
      <stop offset="20%"  stop-color="#a97c1c" />
      <stop offset="45%"  stop-color="#f2c94c" />
      <stop offset="55%"  stop-color="#fff3b0" />
      <stop offset="75%"  stop-color="#c99a2e" />
      <stop offset="100%" stop-color="#6b4c0c" />
    </linearGradient>

    <!-- Franja de brillo que recorre la figura en diagonal -->
    <linearGradient id="shine" x1="-0.6" y1="0" x2="0.4" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5"  stop-color="#fffdf3" stop-opacity="0.95" />
      <stop offset="0.54" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0" />
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0; 1.6 0; -1 0"
        keyTimes="0; 0.5; 1"
        dur="2.8s"
        repeatCount="indefinite" />
    </linearGradient>

    <!-- Desenfoque para el halo pulsante detrás de la letra -->
    <filter id="blurGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <g transform="matrix(1.3999974,0,0,1.3999974,-40.600707,-39.999893)">

    <!-- Halo dorado, pulsa suavemente detrás de la letra -->
    <path
       fill="#ffd700"
       filter="url(#blurGlow)"
       d="M 74.077994 40.000039 L 74.077994 40.000408 L 43.286166 93.333169 L 104.86982 93.333169 L 104.87019 93.333169 L 166.45385 93.333169 L 197.24605 40.000039 L 135.66202 40.000039 L 74.077994 40.000039 z M 104.86982 93.333538 L 74.077994 146.66667 L 74.078364 146.66704 L 43.286166 200.00017 L 104.86982 200.00017 L 104.87019 200.00017 L 166.45385 200.00017 L 197.24605 146.66667 L 135.66202 146.66667 L 166.45385 93.333538 L 104.87019 93.333538 L 104.86982 93.333538 z">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.8s" repeatCount="indefinite" />
    </path>

    <!-- Cuerpo de la letra, gradiente metálico dorado -->
    <path
       fill="url(#goldBase)"
       d="M 74.077994 40.000039 L 74.077994 40.000408 L 43.286166 93.333169 L 104.86982 93.333169 L 104.87019 93.333169 L 166.45385 93.333169 L 197.24605 40.000039 L 135.66202 40.000039 L 74.077994 40.000039 z M 104.86982 93.333538 L 74.077994 146.66667 L 74.078364 146.66704 L 43.286166 200.00017 L 104.86982 200.00017 L 104.87019 200.00017 L 166.45385 200.00017 L 197.24605 146.66667 L 135.66202 146.66667 L 166.45385 93.333538 L 104.87019 93.333538 L 104.86982 93.333538 z" />

    <!-- Franja de brillo en movimiento (mezcla screen para que ilumine sin tapar el metal) -->
    <path
       fill="url(#shine)"
       style="mix-blend-mode:screen"
       d="M 74.077994 40.000039 L 74.077994 40.000408 L 43.286166 93.333169 L 104.86982 93.333169 L 104.87019 93.333169 L 166.45385 93.333169 L 197.24605 40.000039 L 135.66202 40.000039 L 74.077994 40.000039 z M 104.86982 93.333538 L 74.077994 146.66667 L 74.078364 146.66704 L 43.286166 200.00017 L 104.86982 200.00017 L 104.87019 200.00017 L 166.45385 200.00017 L 197.24605 146.66667 L 135.66202 146.66667 L 166.45385 93.333538 L 104.87019 93.333538 L 104.86982 93.333538 z" />

  </g>
</svg>
